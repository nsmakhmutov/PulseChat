[package]
name = "inpulse-media-engine"
version = "0.3.0"
edition = "2021"
description = "High-performance media sidecar: WGC → NVENC H.264 → WebRTC → Pion SFU"
authors = ["InPulse Team"]

[dependencies]

# ── IPC & сериализация ────────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }

# ── Логирование ───────────────────────────────────────────────────────────────
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }

# ── Утилиты ──────────────────────────────────────────────────────────────────
anyhow      = "1"
bytes       = "1"
parking_lot = "0.12"

# ── Windows APIs (D3D11, WGC, DXGI) ─────────────────────────────────────────────
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    # COM / Foundation
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",

    # Direct3D 11
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",

    # Windows Graphics Capture
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",

    # Monitor enumeration
    "Win32_Graphics_Gdi",
]}

# windows-sys removed in v3 (Named Pipe → webrtc-rs)

# ── WebRTC (webrtc-rs → Pion SFU) ────────────────────────────────────────────
# Заменяет Named Pipe: H.264 NAL → RTP → WebRTC → Pion SFU → aiortc viewer
webrtc = "0.11"

# ── FFmpeg bindings (NVENC / AMF / QSV через libav*) ─────────────────────────
ffmpeg-next = "8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
